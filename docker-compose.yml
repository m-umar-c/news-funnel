services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: funnel
      POSTGRES_PASSWORD: funnel
      POSTGRES_DB: funnel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funnel -d funnel"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: sh -c "node dist/db/migrate.js && node dist/db/seed.js && node dist/index.js"
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://funnel:funnel@db:5432/funnel
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - models:/app/.cache

  worker:
    build: .
    command: node dist/worker.js
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://funnel:funnel@db:5432/funnel
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - models:/app/.cache

volumes:
  pgdata:
  models:
